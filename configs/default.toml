[data]
path = "../data/raw/car_data.csv"
reference_year = 2020

[training]
test_size = 0.1
random_state = 42

[model]
n_estimators = 1000
max_depth = 25
min_samples_split = 2
min_samples_leaf = 1
max_features = "sqrt"
n_jobs = -1

[artifacts]
model_path = "../artifacts/model.joblib"
metrics_path = "../artifacts/metrics.json"
